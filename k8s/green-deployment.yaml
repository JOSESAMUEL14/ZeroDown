
apiVersion: apps/v1
kind: Deployment

metadata:
  name: zerodown-green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: zerodown
      version: green

  template:
    metadata:
      labels:
        app: zerodown
        version: green

    spec:
      containers:
        - name: zerodown
          image: zerodown:v2
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
