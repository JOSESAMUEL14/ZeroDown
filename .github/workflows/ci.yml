
name: ZeroDown CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

      - name: Build Blue Docker Image
        run: |
          docker build \
            --build-arg APP_VERSION=v1 \
            -t zerodown:v1 .

      - name: Build Green Docker Image
        run: |
          docker build \
            --build-arg APP_VERSION=v2 \
            -t zerodown:v2 .
